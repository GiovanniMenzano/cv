name: Build LaTeX document
on:
  push:
    branches: [ "main" ]
jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      - name: Set up git repository
        uses: actions/checkout@v3
      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@4.1.0
        with:
          root_file: |
            cv_it.tex
            cv_en.tex
          latexmk_use_xelatex: true
      - name: Uploading artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf
          path: ./*.pdf
          retention-days: 3

      - name: Get release date and time
        id: time
        run: |
          timestamp=$(TZ=Europe/Rome date '+%Y.%m.%d.%H.%M.%S')
          release_date=${timestamp:0:10}
          echo "time=$timestamp" >> "$GITHUB_OUTPUT"
          echo "date=${release_date//./-}" >> "$GITHUB_OUTPUT"

      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@v3.0.3
        with:
          name: cv compiled on ${{ steps.time.outputs.date }}
          tag_name: v${{ steps.time.outputs.time }}
          files: ./*.pdf

      - name: Install Poppler
        run: sudo apt-get update --fix-missing && sudo apt-get install -y poppler-utils
      - name: Convert pdf to png
        run: |
          pages=$(pdfinfo cv_en.pdf | awk '/^Pages:/ {print $2}')
          rm -f -- cv_preview_*.png
          for ((page=1; page<=pages; page++)); do
            pdftoppm -f "$page" -l "$page" -singlefile -r 225 -png cv_en.pdf "cv_preview_$((page - 1))"
          done

      - name: Commit png
        id: commit
        run: |
          git config --local user.email "action[bot]@github.com"
          git config --local user.name "github-actions[bot]"
          git add -A -- 'cv_preview_*.png'
          if git diff --cached --quiet; then
            echo "No preview changes to commit."
          else
            diff_status=$?
            if [ "$diff_status" -ne 1 ]; then
              exit "$diff_status"
            fi
            git commit -m "chore: updated preview images"
          fi
      - name: Push changes
        run: git push origin "HEAD:${GITHUB_REF}"
